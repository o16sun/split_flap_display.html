<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>反転フラップ式案内表示機シミュレーター</title>
  <style>
    :root {
      --bg: #0c0e12;
      --panel: #151921;
      --panel-2: #1c222d;
      --border: rgba(255, 255, 255, 0.1);
      --text: #f3f5f8;
      --muted: #98a2b3;
      --accent: #f5b700;
      --accent-2: #38bdf8;
      --ok: #22c55e;
      --flap-top-bg: #222938;
      --flap-bot-bg: #171c26;
      --flap-ink: #f8fafc;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top, #161c28 0%, var(--bg) 60%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      min-height: 100dvh;
    }

    .app {
      max-width: 980px;
      margin: 0 auto;
      padding: 16px 14px 48px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 14px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-bar {
      width: 6px;
      height: 28px;
      border-radius: 99px;
      background: var(--accent);
      flex-shrink: 0;
    }

    .brand-title {
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(245, 183, 0, 0.16);
      color: var(--accent);
      border: 1px solid rgba(245, 183, 0, 0.35);
    }

    .brand-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .sound-btn {
      appearance: none;
      border: 1px solid rgba(245, 183, 0, 0.45);
      background: rgba(245, 183, 0, 0.12);
      color: #fde68a;
      font-weight: 700;
      font-size: 13px;
      padding: 9px 14px;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    .sound-btn.is-on {
      background: var(--accent);
      color: #111318;
      border-color: var(--accent);
    }

    .board-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 14px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }

    .board-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 12px;
      gap: 8px;
      flex-wrap: wrap;
    }

    .status-dot {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      color: var(--text);
    }

    .status-dot::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 8px var(--ok);
    }

    /* フラップ表示エリア：大きめ＆ダブり防止 */
    .flap-grid {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 8px;
      width: 100%;
      background: #090b0f;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 12px 10px;
    }

    .unit {
      --u-h: 112px;
      --f-size: 56px;
      position: relative;
      width: 100%;
      height: var(--u-h);
      min-height: var(--u-h);
      border-radius: 10px;
      background: #10141c;
      border: 1px solid rgba(255, 255, 255, 0.16);
      overflow: hidden;
      cursor: pointer;
      perspective: 520px;
      user-select: none;
    }

    /* 上半分の窓 */
    .flap-top {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 50%;
      overflow: hidden;
      background: var(--flap-top-bg);
      z-index: 2;
    }

    /* 下半分の窓 */
    .flap-bottom {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 50%;
      overflow: hidden;
      background: var(--flap-bot-bg);
      z-index: 1;
    }

    /* めくれる上フラップ（1枚だけアニメーション） */
    .flap-flipper {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 50%;
      overflow: hidden;
      background: linear-gradient(180deg, #2b3446 0%, #1d2432 100%);
      transform-origin: 50% 100%;
      z-index: 4;
      opacity: 0;
      pointer-events: none;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    /* 文字をユニット全体高さで配置し、上下の窓で切り抜く */
    .glyph {
      position: absolute;
      left: 0;
      width: 100%;
      height: var(--u-h);
      line-height: var(--u-h);
      font-size: var(--f-size);
      font-weight: 800;
      color: var(--flap-ink);
      text-align: center;
    }

    .flap-top .glyph,
    .flap-flipper .glyph {
      top: 0;
    }

    .flap-bottom .glyph {
      top: calc(var(--u-h) * -0.5);
    }

    .unit.is-flipping .flap-flipper {
      opacity: 1;
      animation: flipDown 0.17s ease-in forwards;
    }

    @keyframes flipDown {
      0% {
        transform: rotateX(0deg);
        filter: brightness(1);
      }
      100% {
        transform: rotateX(-90deg);
        filter: brightness(0.65);
      }
    }

    /* 中央のヒンジ・分割線 */
    .center-bar {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 3px;
      margin-top: -1.5px;
      background: #07090d;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.08);
      z-index: 6;
      pointer-events: none;
    }

    .board-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      font-size: 11px;
      color: var(--muted);
      flex-wrap: wrap;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .row-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip-btn, .preset-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      padding: 7px 11px;
      border-radius: 10px;
      cursor: pointer;
    }

    .chip-btn.accent {
      border-color: rgba(56, 189, 248, 0.45);
      color: #bae6fd;
      background: rgba(56, 189, 248, 0.12);
    }

    .presets {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .preset-btn {
      padding: 10px;
      font-size: 13px;
      text-align: center;
    }

    .input-wrap {
      display: flex;
      align-items: center;
      background: #0d1016;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 12px;
    }

    .text-input {
      flex: 1;
      min-width: 0;
      height: 44px;
      border: 0;
      background: transparent;
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    .counter {
      font-size: 12px;
      color: var(--muted);
      margin-left: 8px;
    }

    .form-actions {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .primary-btn {
      appearance: none;
      border: 0;
      background: var(--accent);
      color: #111318;
      font-weight: 800;
      font-size: 14px;
      height: 44px;
      border-radius: 12px;
      cursor: pointer;
    }

    .ghost-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      font-weight: 700;
      font-size: 13px;
      height: 44px;
      padding: 0 16px;
      border-radius: 12px;
      cursor: pointer;
    }

    @media (max-width: 640px) {
      .flap-grid {
        gap: 4px;
        padding: 10px 6px;
      }
      .unit {
        --u-h: 68px;
        --f-size: 32px;
        border-radius: 7px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-bar"></div>
        <div>
          <div class="brand-title">
            <span>SPLIT-FLAP DISPLAY</span>
            <span class="badge">CLEAR ACRYLIC</span>
          </div>
          <div class="brand-sub">反転フラップ式案内表示機（パタパタ表示機）</div>
        </div>
      </div>
      <button id="soundToggle" class="sound-btn" type="button" aria-pressed="false">
        <span id="soundIcon">🔇</span>
        <span id="soundLabel">音 ON</span>
      </button>
    </header>

    <section class="board-card" aria-label="反転フラップ表示部">
      <div class="board-head">
        <span class="status-dot">SPLIT-FLAP MODULE</span>
        <span id="clockReadout">--:--:--</span>
      </div>

      <div id="flapGrid" class="flap-grid"></div>

      <div class="board-foot">
        <span>※パネルをタップすると1コマ音を確認できます</span>
        <span>8 UNITS / CRISP FLAP</span>
      </div>
    </section>

    <section class="panel">
      <div class="panel-title">
        <span>⚡ プリセット＆一斉更新</span>
        <div class="row-actions">
          <button id="cycleTestBtn" class="chip-btn accent" type="button">✈️ 一斉更新テスト</button>
          <button id="reflipBtn" class="chip-btn" type="button">↻ 再めくり</button>
        </div>
      </div>
      <div class="presets">
        <button class="preset-btn" type="button" data-text="京都">京都</button>
        <button class="preset-btn" type="button" data-text="大阪">大阪</button>
        <button class="preset-btn" type="button" data-text="発車します">発車します</button>
        <button class="preset-btn" type="button" data-text="Zeta Dev">Zeta Dev</button>
      </div>
    </section>

    <section class="panel">
      <div class="input-wrap">
        <input id="textInput" class="text-input" type="text" maxlength="8" value="Zeta Dev" placeholder="最大8文字まで入力" />
        <span id="charCount" class="counter">8/8</span>
      </div>
      <div class="form-actions">
        <button id="applyBtn" class="primary-btn" type="button">表示する</button>
        <button id="clearBtn" class="ghost-btn" type="button">クリア</button>
      </div>
    </section>
  </div>

  <script>
    const UNIT_COUNT = 8;
    const CHAR_POOL = " ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをんアイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン京都大阪発車します案内特急急行普通到着出発";

    const flapGrid = document.getElementById("flapGrid");
    const textInput = document.getElementById("textInput");
    const charCount = document.getElementById("charCount");
    const applyBtn = document.getElementById("applyBtn");
    const clearBtn = document.getElementById("clearBtn");
    const reflipBtn = document.getElementById("reflipBtn");
    const cycleTestBtn = document.getElementById("cycleTestBtn");
    const soundToggle = document.getElementById("soundToggle");
    const soundIcon = document.getElementById("soundIcon");
    const soundLabel = document.getElementById("soundLabel");
    const clockReadout = document.getElementById("clockReadout");

    let audioCtx = null;
    let soundEnabled = false;
    let currentChars = Array(UNIT_COUNT).fill(" ");
    let timers = [];

    function initAudio() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        audioCtx = new Ctx();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      soundEnabled = true;
      soundToggle.classList.add("is-on");
      soundToggle.setAttribute("aria-pressed", "true");
      soundIcon.textContent = "🔊";
      soundLabel.textContent = "音 ON";
    }

    function playCrispFlapSound(index = 0) {
      if (!soundEnabled || !audioCtx) return;
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }

      const now = audioCtx.currentTime;
      const panVal = ((index / (UNIT_COUNT - 1)) * 2 - 1) * 0.45;
      const pitchJitter = 0.94 + Math.random() * 0.12;

      const bufferSize = Math.floor(audioCtx.sampleRate * 0.018);
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.28));
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const bp1 = audioCtx.createBiquadFilter();
      bp1.type = "bandpass";
      bp1.frequency.setValueAtTime(2600 * pitchJitter, now);
      bp1.Q.setValueAtTime(2.6, now);

      const bp2 = audioCtx.createBiquadFilter();
      bp2.type = "highpass";
      bp2.frequency.setValueAtTime(1250 * pitchJitter, now);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.32, now + 0.0015);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.018);

      const panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
      noise.connect(bp1);
      bp1.connect(bp2);
      bp2.connect(gain);

      if (panner) {
        panner.pan.setValueAtTime(panVal, now);
        gain.connect(panner);
        panner.connect(audioCtx.destination);
      } else {
        gain.connect(audioCtx.destination);
      }

      noise.start(now);
      noise.stop(now + 0.02);
    }

    const units = [];
    for (let i = 0; i < UNIT_COUNT; i++) {
      const unit = document.createElement("div");
      unit.className = "unit";
      unit.innerHTML = `
        <div class="flap-top"><span class="glyph"> </span></div>
        <div class="flap-bottom"><span class="glyph"> </span></div>
        <div class="flap-flipper"><span class="glyph"> </span></div>
        <div class="center-bar"></div>
      `;
      unit.addEventListener("click", () => {
        initAudio();
        const nextChar = CHAR_POOL[Math.floor(Math.random() * CHAR_POOL.length)];
        stepSingleFlap(i, nextChar);
      });
      flapGrid.appendChild(unit);
      units.push({
        el: unit,
        topGlyph: unit.querySelector(".flap-top .glyph"),
        botGlyph: unit.querySelector(".flap-bottom .glyph"),
        flipGlyph: unit.querySelector(".flap-flipper .glyph")
      });
    }

    function setStaticChar(index, ch) {
      const u = units[index];
      u.topGlyph.textContent = ch;
      u.botGlyph.textContent = ch;
      u.flipGlyph.textContent = ch;
      currentChars[index] = ch;
    }

    function stepSingleFlap(index, nextChar) {
      const u = units[index];
      const prevChar = currentChars[index];

      u.topGlyph.textContent = nextChar;
      u.flipGlyph.textContent = prevChar;
      u.el.classList.remove("is-flipping");
      void u.el.offsetWidth;
      u.el.classList.add("is-flipping");

      playCrispFlapSound(index);

      setTimeout(() => {
        u.botGlyph.textContent = nextChar;
        currentChars[index] = nextChar;
        u.el.classList.remove("is-flipping");
      }, 165);
    }

    function clearTimers() {
      timers.forEach((t) => clearTimeout(t));
      timers = [];
    }

    function displayText(rawText) {
      clearTimers();
      const chars = Array.from(rawText || "").slice(0, UNIT_COUNT);
      while (chars.length < UNIT_COUNT) chars.push(" ");

      for (let i = 0; i < UNIT_COUNT; i++) {
        const target = chars[i];
        const steps = 6 + i * 2 + Math.floor(Math.random() * 4);
        for (let s = 0; s < steps; s++) {
          const delay = i * 45 + s * 62;
          const isLast = s === steps - 1;
          const ch = isLast ? target : CHAR_POOL[Math.floor(Math.random() * CHAR_POOL.length)];
          const timerId = setTimeout(() => {
            stepSingleFlap(i, ch);
          }, delay);
          timers.push(timerId);
        }
      }
    }

    function updateCount() {
      const len = Array.from(textInput.value).length;
      charCount.textContent = `${len}/${UNIT_COUNT}`;
    }

    soundToggle.addEventListener("click", () => {
      if (!soundEnabled) {
        initAudio();
        playCrispFlapSound(3);
      } else {
        soundEnabled = false;
        soundToggle.classList.remove("is-on");
        soundToggle.setAttribute("aria-pressed", "false");
        soundIcon.textContent = "🔇";
        soundLabel.textContent = "音 ON";
      }
    });

    textInput.addEventListener("input", updateCount);
    applyBtn.addEventListener("click", () => {
      initAudio();
      displayText(textInput.value);
    });
    textInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        initAudio();
        displayText(textInput.value);
      }
    });
    clearBtn.addEventListener("click", () => {
      textInput.value = "";
      updateCount();
      initAudio();
      displayText("");
    });
    reflipBtn.addEventListener("click", () => {
      initAudio();
      displayText(textInput.value);
    });

    document.querySelectorAll(".preset-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const val = btn.dataset.text || "";
        textInput.value = val;
        updateCount();
        initAudio();
        displayText(val);
      });
    });

    cycleTestBtn.addEventListener("click", () => {
      initAudio();
      const seq = ["京都", "大阪", "発車します", "Zeta Dev"];
      seq.forEach((word, idx) => {
        const t = setTimeout(() => {
          textInput.value = word;
          updateCount();
          displayText(word);
        }, idx * 1450);
        timers.push(t);
      });
    });

    function tickClock() {
      const d = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      clockReadout.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }
    tickClock();
    setInterval(tickClock, 1000);

    const initial = Array.from("Zeta Dev");
    for (let i = 0; i < UNIT_COUNT; i++) {
      setStaticChar(i, initial[i] || " ");
    }
    updateCount();
  </script>
</body>
</html>
